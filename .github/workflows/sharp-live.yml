name: Sharp money tracker (all leagues, every 10 min)
on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sharp-live
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy
      - name: Capture splits and lines, update signals
        run: python sharp/live_capture.py .
      - name: Save
        run: |
          git config user.name "nba-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add sharp/live
          git diff --cached --quiet || git commit -q -m "Sharp money live $(TZ=America/New_York date '+%F %H:%M')"
          for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && break; sleep $((RANDOM % 15 + 5)); done
