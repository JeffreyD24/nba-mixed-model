name: Props loop (FanDuel lines + PROVISIONAL prop alerts, every ~2 min)

on:
  schedule:
    - cron: "*/10 * * * *"     # each run loops ~50 minutes; extra starts just queue behind it
  push:
    branches: [main]
    paths: [".github/workflows/props-loop.yml", "props_loop.sh"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: props-loop
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -q pandas numpy scipy
      - name: Loop
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          git fetch -q origin main && git checkout -q -B main origin/main
          bash props_loop.sh
