name: Past player-prop lines (The Odds API, 2025-26 then 2024-25)

on:
  push:
    branches: [main]
    paths: [".github/workflows/props-history.yml", "props_history.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: props-history
  cancel-in-progress: false

jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas
      - name: Download in batches, saving after each
        run: |
          git config user.name "nba-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          for b in $(seq 1 26); do
            if [ $b -le 13 ]; then RANGE="--from 2025-10-21 --to 2026-04-12"; else RANGE="--from 2024-10-22 --to 2025-04-13"; fi
            OUT=$(python props_history.py . $RANGE --max-dates 15 2>&1); RC=$?
            echo "$OUT" | tail -3
            git add data/props_history
            if ! git diff --cached --quiet; then
              git commit -q -m "Prop history: $(echo "$OUT" | grep -o '^[0-9-]*' | tail -1)"
              for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 10; done
            fi
            if [ $RC -ne 0 ]; then break; fi
            if echo "$OUT" | grep -q "already saved" && [ $b -gt 13 ]; then break; fi
          done
