name: Evening model run (next day's games)

on:
  schedule:
    - cron: "33 2 * * *"       # 9:33 PM EST / 10:33 PM EDT, after the 8 PM official injury report
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q -r requirements.txt
      - name: Predict tomorrow's games
        run: python tracker.py . --tomorrow
      - name: Save results
        run: |
          git config user.name "nba-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state NBA_Live_Tracker.xlsx
          git diff --cached --quiet || git commit -m "Evening run $(TZ=America/New_York date +%F)"
          ok=0; for i in 1 2 3 4 5; do git pull --rebase -q && git push -q && { ok=1; break; }; sleep $((RANDOM % 15 + 5)); done; [ "$ok" = 1 ]   # Nov 6, 2026: retry; one try lost the Nov 6 evening save to an alert-loop push
