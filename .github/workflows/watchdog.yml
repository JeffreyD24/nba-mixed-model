name: Pipeline watchdog (every 10 minutes)

on:
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"
  push:
    branches: [main]
    paths: [".github/workflows/watchdog.yml", "watchdog.py"]
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: watchdog
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check every pipeline
        env:
          GH_TOKEN: ${{ github.token }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          python watchdog.py .
          git config user.name "watchdog-bot"; git config user.email "actions@users.noreply.github.com"
          git add state/watchdog.json state/watchdog_log.csv
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Watchdog $(TZ=America/New_York date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin main && break; sleep 5; done
