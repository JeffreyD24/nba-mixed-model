name: Probe Polymarket trades and NFL 2025 listing (one-off)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - run: |
          python3 - <<'PY'
          import json, urllib.request
          def g(u):
              try: return json.loads(urllib.request.urlopen(urllib.request.Request(u, headers={"User-Agent":"research-script"}), timeout=30).read())
              except Exception as e: return {"_err": str(e)}
          C = "0xedf1408b852696f5d9c8b6d053532cc9bae26a3b3497bbb0479c1ea23355e31b"
          d = g(f"https://data-api.polymarket.com/v2/trades?condition={C}&limit=1000&taker_only=false")
          print("PAG1", len(d.get("data", [])), json.dumps(d.get("pagination")))
          PY
