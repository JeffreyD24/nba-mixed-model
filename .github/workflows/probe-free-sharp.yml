name: Probe free sharp-price sources (one-off)
on:
  workflow_dispatch: {}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Kalshi fields, Polymarket v2 trades and game markets
        run: |
          curl -sS -m 20 "https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXNBATOTAL&status=open&limit=1" | python3 -c "import json,sys; m=json.load(sys.stdin)['markets'][0]; print('KALSHI', {k: v for k, v in m.items() if not isinstance(v, (list, dict))})"
          curl -sS -m 20 "https://api.elections.kalshi.com/trade-api/v2/markets/trades?ticker=$(curl -sS -m 20 'https://api.elections.kalshi.com/trade-api/v2/markets?series_ticker=KXNBAGAME&status=open&limit=1' | python3 -c "import json,sys; print(json.load(sys.stdin)['markets'][0]['ticker'])")&limit=2" | head -c 500; echo
          for u in "https://data-api.polymarket.com/v2/trades?limit=2" "https://data-api.polymarket.com/v2/trades?limit=2&takerOnly=true" "https://data-api.polymarket.com/trades/v2?limit=2"; do echo "POLY $u"; curl -sS -m 20 "$u" | head -c 700; echo; done
          echo "POLY games"; curl -sS -m 20 "https://gamma-api.polymarket.com/events?tag_slug=games&closed=false&limit=200" | python3 -c "import json,sys; d=json.load(sys.stdin); print(len(d)); [print(' ', e.get('title'), round(e.get('volume') or 0), e.get('slug')) for e in d[:12]]"
          curl -sS -m 20 "https://gamma-api.polymarket.com/sports" | head -c 800; echo
