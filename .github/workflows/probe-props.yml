name: Probe player-prop history

on:
  push:
    branches: [main]
    paths: [".github/workflows/probe-props.yml", "tools/probe_fd_props.py"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Probe
        run: python tools/probe_fd_props.py .
      - name: Save the results
        run: |
          git config user.name "nba-tracker-bot"; git config user.email "actions@users.noreply.github.com"; git fetch -q origin main && git checkout -q -B main origin/main
          git add research/probes
          if git diff --cached --quiet; then exit 0; fi
          git commit -q -m "Props probe results"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push -q origin main && break; sleep 8; done
