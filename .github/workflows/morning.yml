name: Morning model run

on:
  schedule:
    - cron: "41 15 * * *"      # 11:41 AM EDT / 10:41 AM EST: add last night's results, grade, refresh today's games
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q -r requirements.txt
      - name: Run tracker
        run: python tracker.py .
      - name: Shooting luck for the totals (this season's shots so far)
        run: python nba_luck.py . || echo "Shooting luck not updated; alerts use yesterday's file."
      - name: Save tomorrow's model early (for alerts when DraftKings opens tomorrow's lines)
        run: python tracker.py . --tomorrow --model-only || echo "Tomorrow's model not saved this time; the evening run will make it."
      - name: Grade Polymarket paper trades
        run: python polymarket.py . --grade || echo "Polymarket grading failed; it will try again tomorrow."
      - name: Save results
        run: |
          git config user.name "nba-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state NBA_Live_Tracker.xlsx
          if [ -d research/polymarket ]; then git add research/polymarket; fi
          git diff --cached --quiet || git commit -m "Morning run $(TZ=America/New_York date +%F)"
          git pull --rebase -q && git push -q
