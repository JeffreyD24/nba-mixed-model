name: Line check and phone alerts

on:
  schedule:
    - cron: "*/5 * * * *"      # every 5 minutes (GitHub may run these late or skip some when busy)
  workflow_dispatch:
    inputs:
      test:
        description: "Send a test notification instead of checking lines"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q pandas numpy
      - name: Check lines and send alerts
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python alert.py . ${{ inputs.test && '--test' || '' }}
      - name: Save alert log
        run: |
          git config user.name "nba-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          for f in state/alerts.csv state/market_moves.csv state/test_alert_result.txt; do if [ -f "$f" ]; then git add "$f"; fi; done
          git diff --cached --quiet || git commit -m "Alerts $(TZ=America/New_York date '+%F %H:%M')"
          git pull --rebase -q && git push -q
