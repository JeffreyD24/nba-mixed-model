name: Morning model run

on:
  schedule:
    - cron: "41 15 * * *"      # 11:41 AM EDT / 10:41 AM EST: add last night's results, grade, refresh today's games
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: state-writes
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils
          pip install -q -r requirements.txt
      - name: Run tracker
        run: python tracker.py .
      - name: Shooting luck for the totals (this season's shots so far)
        run: python nba_luck.py . || echo "Shooting luck not updated; alerts use yesterday's file."
      - name: Save tomorrow's model early (for alerts when DraftKings opens tomorrow's lines)
        run: python tracker.py . --tomorrow --model-only || echo "Tomorrow's model not saved this time; the evening run will make it."
      - name: Box scores 2026-27 for the market models (ESPN, only games not saved yet)
        run: python player_stats_backfill.py . 2027 || echo "Box scores not updated; the market models use yesterday's."
      - name: Market models (Nov 5, 2026; PROVISIONAL movement bets) - grade last night, refit the opener model
        run: |
          python market_models_live.py . grade || echo "Market models grading failed; it will run again tomorrow."
          python market_models_live.py . fit || echo "Market models refit failed; the 5-minute check retries hourly."
      - name: Bet record by model version
        run: python bet_record.py . || echo "Bet record not updated; it will run again tomorrow."
      - name: Provisional bets review (Nov 4, 2026; research/PROVISIONAL_BETS.md stop/promote lines)
        run: python provisional_review.py . || echo "Provisional review not updated; it will run again tomorrow."
      - name: Shadow record of bets passed for a line move against (Nov 4, 2026; analysis/LINE_MOVE_PREREG.md; not bets)
        run: python shadow_passed.py . || echo "Shadow record not updated; it will run again tomorrow."
      - name: Report watcher grades (Nov 4, 2026; research/spreads/REPORT_WATCH_PLAN.md; TEST, not bets)
        run: python report_watch_grade.py . || echo "Report watch grades not updated; they will run again tomorrow."
      - name: Model 1 shrunk side-by-side record (Nov 3, 2026; Model 1 unchanged)
        run: python shrunk_record.py . || echo "Shrunk record not updated; it will run again tomorrow."
      - name: NBA totals stack side-by-side record (Nov 3, 2026; v4 unchanged)
        run: python stack_record.py . || echo "Stack record not updated; it will run again tomorrow."
      - name: Grade Polymarket paper trades
        run: python polymarket.py . --grade || echo "Polymarket grading failed; it will try again tomorrow."
      - name: Edge statistics (bootstrap ranges, calibration, Pinnacle CLV, books and limits)
        run: python edge_stats.py . || echo "Edge statistics not updated; they will run again tomorrow."
      - name: Check thresholds against the register (config/thresholds.csv)
        run: python tools/check_thresholds.py . || true
      - name: Save results
        run: |
          git config user.name "nba-tracker-bot"
          git config user.email "actions@users.noreply.github.com"
          git add state NBA_Live_Tracker.xlsx
          git add data/player_stats
          if [ -d research/polymarket ]; then git add research/polymarket; fi
          if [ -d research/edge_stats ]; then git add research/edge_stats; fi
          git diff --cached --quiet || git commit -m "Morning run $(TZ=America/New_York date +%F)"
          git pull --rebase -q && git push -q
