name: Historical odds download (The Odds API)
on:
  workflow_dispatch:
    inputs:
      sport: { description: "nba, nhl or nfl (or 'check' to test the key for free)", default: "check" }
      from: { description: "First game date (YYYY-MM-DD)", default: "2021-10-01" }
      to: { description: "Last game date (YYYY-MM-DD)", default: "2024-06-30" }
permissions:
  contents: write
concurrency:
  group: odds-history-${{ inputs.sport }}-${{ inputs.from }}
  cancel-in-progress: false
jobs:
  download:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas
      - name: Check the key (free)
        run: python odds_history.py . --check
      - name: Download in batches, saving after each
        if: ${{ inputs.sport != 'check' }}
        run: |
          git config user.name "nba-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          START=$(date +%s)
          while [ $(( $(date +%s) - START )) -lt 18000 ]; do
            OUT=$(python odds_history.py . --sport "${{ inputs.sport }}" --from "${{ inputs.from }}" --to "${{ inputs.to }}" --max-dates 15 2>&1) && RC=0 || RC=$?
            echo "$OUT" | tail -3
            git add data/odds_history
            if ! git diff --cached --quiet; then
              git commit -q -m "Historical odds: ${{ inputs.sport }} through $(echo "$OUT" | grep -o '^[0-9-]*' | tail -1)"
              for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 10; done
            fi
            if [ $RC -ne 0 ] || echo "$OUT" | grep -q "already saved"; then break; fi
          done
