name: Player box stats backfill (ESPN, for props)

on:
  push:
    branches: [main]
    paths: [".github/workflows/player-stats-backfill.yml", "player_stats_backfill.py"]
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: player-stats-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy
      - name: Fetch season by season, saving after each
        run: |
          git config user.name "nba-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          for s in 2027 2026 2025 2024 2023 2022; do
            python player_stats_backfill.py . $s
            git add data/player_stats
            if ! git diff --cached --quiet; then
              git commit -q -m "Player box stats: season $s"
              for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && break; sleep 10; done
            fi
          done
