name: SBR college basketball archive (one-off download)
on:
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Find and download the NCAA basketball spreadsheets (public downloads on sportsbookreviewsonline.com)
        run: |
          mkdir -p data/external/sbr_ncaab
          IDX="https://www.sportsbookreviewsonline.com/scoresoddsarchives/ncaabasketball/ncaabasketballoddsarchives.htm"
          curl -sSL -A "Mozilla/5.0" -o /tmp/idx.html -w "index HTTP %{http_code}\n" "$IDX" || true
          grep -oiE 'href="[^"]*\.xlsx?"' /tmp/idx.html | sed 's/href="//I; s/"$//' | sort -u > /tmp/links.txt || true
          echo "links found: $(wc -l < /tmp/links.txt)"; cat /tmp/links.txt
          while read -r L; do
            case "$L" in http*) U="$L";; /*) U="https://www.sportsbookreviewsonline.com$L";; *) U="https://www.sportsbookreviewsonline.com/scoresoddsarchives/ncaabasketball/$L";; esac
            F="data/external/sbr_ncaab/$(basename "$L" | sed 's/%20/_/g; s/ /_/g')"
            curl -sSL -A "Mozilla/5.0" -o "$F" -w "$F HTTP %{http_code} %{size_download}\n" "$U" || true
          done < /tmp/links.txt
          if [ "$(wc -l < /tmp/links.txt)" = "0" ]; then
            for y in 2007-08 2010-11 2015-16 2019-20 2020-21; do
              for U in "https://www.sportsbookreviewsonline.com/scoresoddsarchives/ncaabasketball/ncaa%20basketball%20$y.xlsx" \
                       "https://www.sportsbookreviewsonline.com/wp-content/uploads/sportsbookreviewsonline_com_737/ncaa-basketball-$y.xlsx"; do
                curl -sSL -A "Mozilla/5.0" -o /tmp/t.xlsx -w "$U HTTP %{http_code} %{size_download}\n" "$U" || true
              done
            done
            head -c 3000 /tmp/idx.html
          fi
          find data/external/sbr_ncaab -size -2k -delete
          ls -la data/external/sbr_ncaab
      - name: Save
        run: |
          git config user.name "nba-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add data/external/sbr_ncaab
          git diff --cached --quiet || git commit -m "SBR college basketball archive (raw spreadsheets)"
          for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 5; done
