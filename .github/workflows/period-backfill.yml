name: Past quarter/half lines backfill (Action Network)

on:
  push:
    branches: [main]
    paths: [".github/workflows/period-backfill.yml", "period_backfill.py"]
  workflow_dispatch:
    inputs:
      from: { description: "First game date", default: "2021-10-19" }
      to: { description: "Last game date", default: "2026-04-12" }

permissions:
  contents: write

concurrency:
  group: period-backfill
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy
      - name: Download in batches, saving after each
        run: |
          git config user.name "nba-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          # start from the newest main, not the commit that triggered the run (a queued run otherwise re-downloads saved dates)
          git fetch -q origin main && git checkout -q -B main origin/main
          FROM="${{ inputs.from || '2021-10-19' }}"; TO="${{ inputs.to || '2026-04-12' }}"
          for b in $(seq 1 20); do
            OUT=$(python period_backfill.py . --from "$FROM" --to "$TO" --max-dates 50 2>&1) && RC=0 || RC=$?
            echo "$OUT" | tail -2
            git add data/period_history
            if ! git diff --cached --quiet; then
              git commit -q -m "Period lines backfill: $(echo "$OUT" | tail -1)"
              for i in 1 2 3 4 5; do git pull --rebase --autostash -q origin main && git push -q origin main && break; sleep 10; done
            fi
            if [ $RC -ne 0 ] || echo "$OUT" | grep -q "already saved"; then break; fi
          done
