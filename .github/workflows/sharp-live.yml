name: Sharp money tracker (all leagues, about every minute)
on:
  schedule:
    - cron: "1,31 * * * *"      # each run loops ~28 min capturing once a minute (sharp/live_loop.sh)
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: sharp-live
  cancel-in-progress: false
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 33
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas numpy
      - name: Capture about once a minute for ~28 minutes
        run: bash sharp/live_loop.sh
