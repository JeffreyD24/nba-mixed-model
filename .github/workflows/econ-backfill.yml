name: Economics history download
on: workflow_dispatch
permissions:
  contents: write
jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -q pandas
      - run: python econ/backfill.py
      - name: Save
        run: |
          git config user.name "nba-tracker-bot"; git config user.email "actions@users.noreply.github.com"
          git add econ/data
          git diff --cached --quiet && exit 0
          git commit -q -m "Economics history download"
          for i in 1 2 3 4 5; do git pull --rebase --autostash -q && git push -q && exit 0; sleep 10; done
